name: core

# core ワークスペースの fmt(ホスト非依存)と Linux ホストでの clippy / test。
# Windows ホストでの core の clippy / test は windows.yml、アプリ固有のチェックは各 OS の workflow。
on:
  push:
    branches: ['feat/rust-*', 'main']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path core/Cargo.toml --workspace --no-fail-fast
