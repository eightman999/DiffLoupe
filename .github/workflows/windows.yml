name: windows

on:
  push:
    branches: ['feat/rust-*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            apps/windows
            apps/edition

      - name: cargo fmt --check
        run: |
          cargo fmt --check --manifest-path apps/windows/Cargo.toml
          cargo fmt --check --manifest-path apps/edition/Cargo.toml
          cargo fmt --check --manifest-path core/Cargo.toml

      - name: clippy (core)
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: clippy (apps, x86_64)
        run: |
          cargo clippy --manifest-path apps/edition/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path apps/windows/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: cargo test (core)
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: cargo test (apps/windows, host-independent modules)
        run: cargo test --manifest-path apps/windows/Cargo.toml

      - name: cargo test (apps/edition)
        run: cargo test --manifest-path apps/edition/Cargo.toml

      - name: Release build (x86_64-pc-windows-msvc)
        run: cargo build --manifest-path apps/windows/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Release build (aarch64-pc-windows-msvc, best-effort)
        continue-on-error: true
        run: cargo build --manifest-path apps/windows/Cargo.toml --release --target aarch64-pc-windows-msvc

      - name: Smoke test (GUI + screenshots)
        run: |
          New-Item -ItemType Directory -Force -Path smoke-out | Out-Null
          .\apps\windows\target\x86_64-pc-windows-msvc\release\diffloupe-win.exe --smoke-test SwiftUI\TestFixtures\left SwiftUI\TestFixtures\right smoke-out
          Get-ChildItem smoke-out

      - name: Report exe size
        run: |
          $exe = "apps\windows\target\x86_64-pc-windows-msvc\release\diffloupe-win.exe"
          "{0:N1} KB" -f ((Get-Item $exe).Length / 1KB)

      - name: Upload artifacts (exe + smoke screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: diffloupe-win-x86_64
          path: |
            apps/windows/target/x86_64-pc-windows-msvc/release/diffloupe-win.exe
            smoke-out/*.bmp
          retention-days: 14
