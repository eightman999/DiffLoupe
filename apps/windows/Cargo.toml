[workspace]

[package]
name = "diffloupe-win"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "DiffLoupe Windows native GUI (Win32, Free edition)"
build = "build.rs"

[[bin]]
name = "diffloupe-win"
path = "src/main.rs"

[lib]
name = "diffloupe_win"
path = "src/lib.rs"

[dependencies]
diffloupe-core = { path = "../../core/crates/diffloupe-core" }
diffloupe-edition = { path = "../edition" }
# 設定・履歴の永続化(JSON)。core と同じ既定許可クレートを再利用する。
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[target.'cfg(windows)'.dependencies]
# Win32 API バインディング。ネイティブ UI(TreeView/ListView/カスタム描画/共通ダイアログ/
# WIC/PrintWindow)に必要な最小限のフィーチャのみ有効化する。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
