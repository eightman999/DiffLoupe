[package]
name = "diffloupe-cli"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "diffloupe CLI (Rust port of the Swift CLI)"

[lib]
name = "diffloupe_cli"
path = "src/lib.rs"

[[bin]]
name = "diffloupe"
path = "src/main.rs"

[dependencies]
diffloupe-core = { path = "../diffloupe-core" }
