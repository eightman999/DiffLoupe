[package]
name = "diffloupe-core"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "DiffLoupe comparison engine (Rust port of the Swift core)"

[dependencies]
sha2 = "0.10"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
quick-xml = { version = "0.38", features = ["encoding"] }
memchr = "2"

# asm フィーチャは MSVC/musl 以外の x86_64 ターゲットでのみ有効化する。
# cc-rs の asm ビルドは MSVC では lib.exe、musl では x86_64-linux-musl-gcc が
# 必要なため、非対応ホストからの cross check を通せるよう条件分岐する。
[target.'cfg(all(target_arch = "x86_64", not(any(target_env = "msvc", target_env = "musl"))))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
