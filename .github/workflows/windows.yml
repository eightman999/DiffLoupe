name: windows

on:
  push:
    branches: ['feat/rust-*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            apps/windows
            apps/edition

      - name: cargo fmt --check
        run: |
          cargo fmt --check --manifest-path apps/windows/Cargo.toml
          cargo fmt --check --manifest-path apps/edition/Cargo.toml
          cargo fmt --all --check --manifest-path core/Cargo.toml

      - name: clippy (core)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: clippy (apps, x86_64)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --manifest-path apps/edition/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path apps/windows/Cargo.toml --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: cargo test (core)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path core/Cargo.toml --workspace --no-fail-fast

      - name: cargo test (apps/windows, host-independent modules)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path apps/windows/Cargo.toml --no-fail-fast

      - name: cargo test (apps/edition)
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path apps/edition/Cargo.toml --no-fail-fast

      - name: Release build (x86_64-pc-windows-msvc)
        if: ${{ !cancelled() }}
        run: cargo build --manifest-path apps/windows/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Release build (aarch64-pc-windows-msvc, best-effort)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo build --manifest-path apps/windows/Cargo.toml --release --target aarch64-pc-windows-msvc

      - name: Smoke test (GUI + screenshots)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-out | Out-Null
          $exe = (Resolve-Path "apps\windows\target\x86_64-pc-windows-msvc\release\diffloupe-win.exe").Path
          $left = (Resolve-Path "SwiftUI\TestFixtures\left").Path
          $right = (Resolve-Path "SwiftUI\TestFixtures\right").Path
          $out = (Resolve-Path "smoke-out").Path
          # GUI サブシステムの exe は呼び出し演算子では待たないため Start-Process -Wait で終了を待つ
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test", "`"$left`"", "`"$right`"", "`"$out`"" `
            -Wait -PassThru
          $code = $p.ExitCode
          Write-Host "ExitCode: $code"
          Write-Host "---- smoke.log ----"
          if (Test-Path "$out\smoke.log") { Get-Content "$out\smoke.log" } else { Write-Host "(smoke.log なし: 起動直後に終了した可能性)" }
          Write-Host "---- smoke-out ----"
          Get-ChildItem $out | Format-Table Name, Length
          if ($code -ne 0) { throw "smoke test failed: ExitCode=$code" }

      - name: Report exe size
        if: ${{ !cancelled() }}
        run: |
          $exe = "apps\windows\target\x86_64-pc-windows-msvc\release\diffloupe-win.exe"
          "{0:N1} KB" -f ((Get-Item $exe).Length / 1KB)

      - name: Upload artifacts (exe + smoke screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: diffloupe-win-x86_64
          path: |
            apps/windows/target/x86_64-pc-windows-msvc/release/diffloupe-win.exe
            smoke-out/*.bmp
            smoke-out/smoke.log
          retention-days: 14
