[workspace]
resolver = "2"
members = ["crates/diffloupe-core", "crates/diffloupe-cli", "crates/diffloupe-ffi"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# macOS アプリへ静的リンクする diffloupe-ffi 用プロファイル。
# CLI(release)は速度優先のまま、アプリは配布サイズを優先する。
[profile.release-ffi]
inherits = "release"
opt-level = 2
lto = "fat"
